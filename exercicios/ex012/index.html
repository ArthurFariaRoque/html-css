<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos em HTML5</title>
</head>
<body>
    <h1>Inserindo vídeos hospedados localmente</h1>
    <p>Este vídeo está alocado no meu próprio servidor.</p>
    <video width="350" poster="imagens/images (1).png" controls>
    <source src="midia/Meu-Video.mp4" type="videobom/mp4">
    <source src="midia/meu-video-ruim.mp4" type="video/mp4">
    <p>Seu navegador não é compatível</p>
    </video>
    <p>Inserindo vídeos do YouTube!</p>
    <iframe width="400" height="200" src="https://www.youtube.com/embed/b9CpSnTGNXo?si=hDnsTOAixdmE7Sl7" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
