<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagens Dinamicas</h1>
    <p>Tente abrir esse site em varios dispositivos diferentes ou simplesmente aumente o tamanho do seu navegador</p>
    <picture>
        <source media="(max-width:750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width:1050px )" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="imagem flexivel">
    </picture>
    <h1>Reproduzindo Áudio</h1>
    <p>Vamos reproduzir áudios em HTML5</p>
    <audio src="midia/musicayt.mp3" controls ></audio>
    <!-- MP3 WAV OGG -->
    <audio src="midia/podcastgg.mp3" controls ></audio>
    <audio preload="metadata" >
        <source src="midia/podcastgg.mp3" type="audio/mpeg">
        <source src="midia/musicayt.mp3" type="audio/ogg">
        <source src="midia/musicayt.mp3" type="audio/wav">
        <p>Infelizmente seu navegador não consegue reproduzir audio.</p>
        <a href="midia/podcastgg.mp3">Clique aqui para baixar o arquivo mp3</a>

    </audio>
</body>
</html>
